{% macro modal_window(class_name, icon, title, inputs, desc, submit_name) %}

<div class="modal-wrapper {{ class_name }}" id="modal-wrapper">

    <div class="modal" id="modal">

        <div class="modal-header">
            <div class="icon">
                {{ icon | safe }}
            </div>
            <button class="cross" onclick="closeModal('{{ class_name }}')">
                <img src="{{ url_for('static', filename='img/cross.svg') }}" alt="" >
            </button>
        </div>

        <div class="modal-content">
            <div class="title">
                {{ title }}
            </div>

            <form name="{{ form_name }}" method="post">
                <div class="inputs">
                    {{ inputs | safe }}
                </div>

                <div class="errors">
                    {% for mes in get_flashed_messages() %}
                        {{ mes }}
                    {% endfor %}
                </div>

                <div class="desc">
                    {{ desc | safe }}
                </div>

                <div class="btns">
                    <button type="button" class="cancel-btn" onclick="closeModal('{{ class_name }}')">Закрыть</button>
                    <input class="submit-btn" type="submit" value="{{ submit_name }}">
                </div>
            </form>

        </div>

    </div>

</div>

{% endmacro %}
