<!--- Модальное окно для настроек --->
<div class="settings-modal-wrapper" style="display:none">

    <div class="settings-modal">
        <div class="header">
            <div class="title">Настройки</div>
            <div class="close"></div>
        </div>
        <div class="user-settings">
            <img src="{{ url_for('static', filename='img/avatars/ava' + current_user.avatar + '.png') }}" alt="" class="user-ava" data-id="{{ current_user.avatar }}">
            <div class="user-wrapper">
                <div class="username">
                    <div class="text">Username</div>
                    <input type="text" class="input" value="{{ current_user.name }}">
                </div>
                <div class="email">
                    <div class="text">Email</div>
                    <input type="email" class="input" value="{{ current_user.email }}">
                </div>
                <div class="errors"></div>
            </div>
        </div>

        <div class="avatar-settings">
            <div class="title">Аватар</div>
            <div class="avatar-items">
                <img src="{{ url_for('static', filename='img/avatars/ava0.png') }}" alt="" class="item">
                <img src="{{ url_for('static', filename='img/avatars/ava1.png') }}" alt="" class="item">
                <img src="{{ url_for('static', filename='img/avatars/ava2.png') }}" alt="" class="item">
                <img src="{{ url_for('static', filename='img/avatars/ava3.png') }}" alt="" class="item">
                <img src="{{ url_for('static', filename='img/avatars/ava4.png') }}" alt="" class="item">
                <img src="{{ url_for('static', filename='img/avatars/ava5.png') }}" alt="" class="item">
                <img src="{{ url_for('static', filename='img/avatars/ava6.png') }}" alt="" class="item">
                <img src="{{ url_for('static', filename='img/avatars/ava7.png') }}" alt="" class="item">
                </div>
        </div>

        <div class="accent-settings">
            <div class="title">Акцентный цвет</div>
            <div class="accent-wrapper">
                <div class="text">
                    Выберите цвет, который будет использован во всем приложении
                </div>
                <div class="picker">
                    <input type="color" class="input-picker" value="{{ current_user.color }}">
                </div>
            </div>
        </div>

        <div class="buttons-settings">
            <button class="cancel">Закрыть</button>
            <button class="save">Сохранить</button>
        </div>
    </div>

</div>
